<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отзывы | Romeo Skup</title>
<meta name="description" content="Отзывы клиентов о выкупе Пушкинских карт. Средняя оценка 4.9 из 5.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2308070c'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23b8ff2f' font-family='Arial Black,sans-serif' font-weight='900'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/theme.js"></script>
</head>
<body>

<div class="noise" aria-hidden="true"></div>
<div class="bg-grid" aria-hidden="true"></div>
<div class="orb orb-pink" aria-hidden="true"></div>
<div class="orb orb-green" aria-hidden="true"></div>

<main>
  <section class="section page-hero" id="reviews">
    <div class="container">
      <div class="section-head reveal">
        <span class="kicker">// нам доверяют</span>
        <h2>Отзывы <span class="grad-pink">клиентов</span></h2>
        <p>Средняя оценка <strong class="g">4.9 из 5</strong> · 640+ отзывов о сделках</p>
      </div>
      <div class="reviews-toolbar reveal">
        <button class="btn btn-ghost" id="addReviewBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
          Оставить отзыв
        </button>
      </div>
      <div class="reviews-grid" id="reviewsGrid"></div>
    </div>
  </section>

  <section class="section final">
    <div class="container">
      <div class="final-panel reveal">
        <div class="fp-glow" aria-hidden="true"></div>
        <h2>Стань следующим <span class="solid-green">отзывом</span></h2>
        <p>Продай карту и поделись впечатлениями о сделке.</p>
        <div class="final-actions">
          <a href="#" class="btn btn-primary js-sell">Продать карту
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
          </a>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="/js/layout.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
