<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Панель Ромео | Romeo Skup Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2308070c'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23b8ff2f' font-family='Arial Black,sans-serif' font-weight='900'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/theme.js"></script>
</head>
<body class="admin-page">

<div class="noise" aria-hidden="true"></div>
<div class="bg-grid" aria-hidden="true"></div>
<div class="orb orb-pink" aria-hidden="true"></div>
<div class="orb orb-green" aria-hidden="true"></div>

<!-- ADMIN HEADER -->
<header class="admin-header">
  <div class="admin-head-inner">
    <a href="/" class="logo">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>
      </span>
      <span class="logo-text">ROMEO<small>ADMIN</small></span>
    </a>

    <div class="admin-user-bar">
      <div class="theme-picker" id="themePicker">
        <button type="button" class="theme-btn" id="themeBtn" title="Сменить тему оформления" aria-label="Сменить тему">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
        <div class="theme-menu">
          <div class="theme-menu-title">Тема оформления</div>
          <button type="button" class="theme-opt" data-theme="cyberpunk">
            <span class="theme-swatch sw-cyberpunk"></span>
            <span>Неон</span>
          </button>
          <button type="button" class="theme-opt" data-theme="dark">
            <span class="theme-swatch sw-dark"></span>
            <span>Тёмная</span>
          </button>
          <button type="button" class="theme-opt" data-theme="midnight">
            <span class="theme-swatch sw-midnight"></span>
            <span>Полночь</span>
          </button>
          <button type="button" class="theme-opt" data-theme="emerald">
            <span class="theme-swatch sw-emerald"></span>
            <span>Изумруд</span>
          </button>
          <button type="button" class="theme-opt" data-theme="sunset">
            <span class="theme-swatch sw-sunset"></span>
            <span>Закат</span>
          </button>
          <button type="button" class="theme-opt" data-theme="oled">
            <span class="theme-swatch sw-oled"></span>
            <span>Глубокий OLED</span>
          </button>
        </div>
      </div>
      <div class="admin-badge">
        <span class="badge-dot"></span>
        <span id="adminName">Ромео (Администратор)</span>
      </div>
      <a href="/" class="btn btn-ghost btn-sm">На сайт</a>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Выйти</button>
    </div>
  </div>
</header>

<!-- ADMIN DASHBOARD / CHATS LAYOUT -->
<main class="admin-layout" id="adminLayout">
  <!-- SIDEBAR: CHAT LIST -->
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-head">
      <div class="sidebar-title">
        <h3>Диалоги с клиентами</h3>
        <span class="chat-count-pill" id="chatCount">0</span>
      </div>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Поиск по имени или логину...">
      </div>
    </div>

    <div class="chat-list" id="chatList">
      <div class="chat-list-empty">Загрузка диалогов...</div>
    </div>
  </aside>

  <!-- MAIN CHAT WINDOW -->
  <section class="admin-chat" id="adminChat">
    <!-- EMPTY STATE (NO CHAT SELECTED) -->
    <div class="admin-chat-placeholder" id="chatPlaceholder">
      <div class="placeholder-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <h3>Выберите диалог для ответа</h3>
      <p>Слева отображаются все клиенты, которые написали вам в чат.</p>
    </div>

    <!-- ACTIVE CHAT VIEW -->
    <div class="admin-chat-view" id="chatView" style="display:none;">
      <!-- CHAT HEADER -->
      <div class="ac-head">
        <button class="ac-back-btn" id="backToListBtn" aria-label="Назад к списку">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5m7 7-7-7 7-7"/></svg>
        </button>
        <div class="ac-user-avatar" id="activeUserAvatar">К</div>
        <div class="ac-user-info">
          <strong id="activeUserName">Имя клиента</strong>
          <span id="activeUserLogin">@login</span>
        </div>
        <div class="ac-deal-rate">
          <span>Курс: <strong>10%</strong></span>
        </div>
      </div>

      <!-- QUICK REPLIES BAR -->
      <div class="quick-templates">
        <button type="button" class="q-btn" data-text="Сколько у вас остаток на Пушкинской карте? Посчитаю сумму к выплате.">💰 Остаток?</button>
        <button type="button" class="q-btn" data-text="Наш курс — 10% от остатка. Оплата на карту любого банка РФ или по СБП в течение 5 минут.">⚡ Курс 10%</button>
        <button type="button" class="q-btn" data-text="Пришлите, пожалуйста, скриншот баланса и номер карты/СБП для перевода.">📸 Запросить реквизиты</button>
        <button type="button" class="q-btn" data-text="Баллы успешно списаны, деньги отправлены на ваши реквизиты! 💚 Спасибо за сделку!">✅ Выплата отправлена</button>
      </div>

      <!-- MESSAGES CONTAINER -->
      <div class="ac-messages" id="acMessages"></div>

      <!-- MEDIA PREVIEW BAR (IF ATTACHED) -->
      <div class="media-preview-bar" id="mediaPreviewBar" style="display:none;">
        <div class="mp-content" id="mediaPreviewContent"></div>
        <button type="button" class="mp-remove-btn" id="removeMediaBtn" aria-label="Удалить прикрепление">✕</button>
      </div>

      <!-- RECORDING STATUS BAR -->
      <div class="voice-recording-bar" id="voiceRecordingBar" style="display:none;">
        <div class="v-rec-pulse"></div>
        <span class="v-rec-label">Запись голосового сообщения...</span>
        <span class="v-rec-timer" id="voiceTimer">0:00</span>
        <button type="button" class="v-btn v-cancel" id="cancelVoiceBtn">Отмена</button>
        <button type="button" class="v-btn v-send" id="sendVoiceBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
          Отправить
        </button>
      </div>

      <!-- INPUT ROW -->
      <form class="ac-input-row" id="adminSendForm">
        <!-- Hidden file input for photos -->
        <input type="file" id="photoInput" accept="image/*" style="display:none;">
        
        <button type="button" class="ac-action-btn" id="attachPhotoBtn" title="Прикрепить фото">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </button>

        <button type="button" class="ac-action-btn" id="recordVoiceBtn" title="Записать голосовое сообщение">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        </button>

        <input type="text" id="adminInput" placeholder="Напишите ответ клиенту от имени Ромео..." maxlength="1000" autocomplete="off">

        <button type="submit" class="ac-send-btn" id="adminSubmitBtn" title="Отправить сообщение" aria-label="Отправить">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </form>
    </div>
  </section>
</main>

<!-- LIGHTBOX FOR IMAGES -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
  <div class="lightbox-inner">
    <button class="lightbox-close" id="lightboxClose" aria-label="Закрыть">✕</button>
    <img src="" id="lightboxImg" alt="Просмотр фото">
  </div>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
